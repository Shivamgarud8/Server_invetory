# Internal static file server for the SPA (TLS and /api proxying happen in tagid-portal-nginx)
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-store";
        try_files $uri /index.html;
    }
}
