name: tagid-infra-manager

# Open the portal at  http://<server-ip>:FRONTEND_PORT   (API also on BACKEND_PORT)
# Default: connect to the PostgreSQL server configured by DB_HOST / DB_PORT / DB_NAME in .env.
# Dedicated DB container "server-db": set COMPOSE_PROFILES=server-db and DB_HOST=server-db in .env.

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

services:
  tagid-portal-frontend:
    build: ./frontend
    image: tagid-infra-manager-ui:${APP_VERSION:-1.6.0}
    container_name: tagid-portal-frontend
    restart: unless-stopped
    depends_on: [tagid-portal-backend]
    ports:
      - "${BIND_IP:-0.0.0.0}:${FRONTEND_PORT:-3006}:8080"   # web UI (also proxies /api to the backend)
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    networks: [edge]
    logging: *logging

  tagid-portal-backend:
    build: ./backend
    image: tagid-infra-manager-api:${APP_VERSION:-1.6.0}
    container_name: tagid-portal-backend
    restart: unless-stopped
    depends_on:
      server-db:
        condition: service_healthy
        required: false        # only when the server-db profile is enabled
    env_file: .env
    environment:
      TZ: ${TZ:-Asia/Kolkata}
      APP_HOST: 0.0.0.0
      APP_PORT: "8080"        # fixed inside the container; change BACKEND_PORT to move it on the host
    ports:
      - "${BIND_IP:-0.0.0.0}:${BACKEND_PORT:-8090}:8080"    # API, e.g. http://<ip>:8090/api/health
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    volumes:
      - portal-secrets:/app/secrets           # auto-generated APP_SECRET_KEY / CREDENTIAL_ENCRYPTION_KEY
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach PostgreSQL / Vault running on the Docker host
    networks: [edge, db]
    logging: *logging

  # Background worker: scheduled email reports, status checks, daily configuration snapshots
  tagid-portal-scheduler:
    build: ./backend
    image: tagid-infra-manager-api:${APP_VERSION:-1.6.0}
    container_name: tagid-portal-scheduler
    restart: unless-stopped
    depends_on: [tagid-portal-backend]   # the backend runs migrations and generates the keys first
    entrypoint: ["python", "-m", "app.scheduler"]
    env_file: .env
    environment:
      TZ: ${TZ:-Asia/Kolkata}
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    volumes:
      - portal-secrets:/app/secrets:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [edge, db]
    healthcheck:
      disable: true
    logging: *logging

  # Dedicated database for this portal (enabled by COMPOSE_PROFILES=server-db in .env).
  # Your other PostgreSQL servers are never touched.
  server-db:
    profiles: [server-db]
    image: postgres:18-alpine
    container_name: server-db
    restart: unless-stopped
    command: ["postgres", "-c", "port=${DB_PORT:-5269}"]
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: ${TZ:-Asia/Kolkata}
    ports:
      - "${BIND_IP:-0.0.0.0}:${DB_PORT:-5269}:${DB_PORT:-5269}"   # e.g. for pgAdmin / backups
    volumes:
      - ${DATA_DIR:-/tagid_data/infra-manager}/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -p ${DB_PORT:-5269} -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [db]
    logging: *logging

volumes:
  portal-secrets: {}

networks:
  edge: {}
  db: {}
