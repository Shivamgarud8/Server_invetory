name: tagid-infra-manager

# Default: connect to the PostgreSQL server configured by DB_HOST / DB_PORT / DB_NAME in .env.
# To run a dedicated PostgreSQL container instead: set DB_HOST=tagid-portal-postgres and
#   docker compose --profile bundled-db up -d

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

services:
  tagid-portal-nginx:
    image: nginx:1.27-alpine
    container_name: tagid-portal-nginx
    restart: unless-stopped
    depends_on: [tagid-portal-frontend, tagid-portal-backend]
    ports:
      - "${HTTPS_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:8443"
      - "${HTTPS_BIND:-0.0.0.0}:${HTTP_PORT:-80}:8080"
    environment:
      PUBLIC_HTTPS_PORT: ${HTTPS_PORT:-443}
      NGINX_ENVSUBST_FILTER: "^PUBLIC_"
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks: [edge]
    logging: *logging

  tagid-portal-frontend:
    build: ./frontend
    image: tagid-infra-manager-ui:${APP_VERSION:-1.0.0}
    container_name: tagid-portal-frontend
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    networks: [edge]
    logging: *logging

  tagid-portal-backend:
    build: ./backend
    image: tagid-infra-manager-api:${APP_VERSION:-1.0.0}
    container_name: tagid-portal-backend
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: ${TZ:-Asia/Kolkata}
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach PostgreSQL / Vault running on the Docker host
    networks: [edge, db]
    logging: *logging

  tagid-portal-postgres:
    profiles: [bundled-db]
    image: postgres:18-alpine
    container_name: tagid-portal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: ${TZ:-Asia/Kolkata}
    volumes:
      - ${DATA_DIR:-/tagid_data/infra-manager}/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [db]          # never published to the host
    logging: *logging

networks:
  edge: {}
  db:
    internal: true
